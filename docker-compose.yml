version: "3.9"

services:
  backend:
    build:
      context: ./backend
    image: opendevagent-backend
    container_name: opendevagent-backend
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - ./sandbox_templates:/app/sandbox_templates:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"

  frontend:
    image: node:20-bullseye
    container_name: opendevagent-frontend
    working_dir: /app
    command: >-
      bash -lc "corepack enable pnpm && pnpm install && pnpm dev --hostname 0.0.0.0 --port 3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    volumes:
      - ./apps/web:/app
      - ./frontend:/frontend
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pnpm-store:
    driver: local
