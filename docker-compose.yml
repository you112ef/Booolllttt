version: "3.9"

services:
  backend:
    build:
      context: ./backend
    image: opendevagent-backend
    container_name: opendevagent-backend
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg://opendevagent:opendevagent@postgres:5432/opendevagent
    volumes:
      - ./backend:/app
      - ./sandbox_templates:/app/sandbox_templates:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    image: node:20-bullseye
    container_name: opendevagent-frontend
    working_dir: /app
    command: >-
      bash -lc "corepack enable pnpm && pnpm install && pnpm dev --hostname 0.0.0.0 --port 3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    volumes:
      - ./apps/web:/app
      - ./frontend:/frontend
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: opendevagent-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=opendevagent
      - POSTGRES_USER=opendevagent
      - POSTGRES_PASSWORD=opendevagent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  pnpm-store:
    driver: local
  postgres-data:
    driver: local
